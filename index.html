<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>싸지른! - THE ULTIMATE SURVIVAL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=Nanum+Myeongjo:wght@400;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game-container">
        <!-- Start Screen -->
        <div id="start-screen" class="overlay">
            <div class="glass-card">
                <h1 class="glitch" data-text="싸지른!">싸지른!</h1>
                <p class="subtitle">THE ULTIMATE SURVIVAL</p>
                <button class="btn btn-primary" id="start-btn">
                    <span>무대 시작</span>
                    <div class="btn-glow"></div>
                </button>
            </div>
        </div>

        <!-- Game Over -->
        <div id="game-over" class="overlay hidden">
            <div class="glass-card">
                <div class="game-over-text">WASTED</div>
                <p class="stats">지려버렸습니다...</p>
                <button class="btn btn-secondary" id="restart-btn">다시 도전</button>
            </div>
        </div>

        <!-- Clear Screen -->
        <div id="clear-screen" class="overlay hidden">
            <div id="clear-text" class="hidden">
                <h1 class="clear-title">LEGENDARY</h1>
                <p>당신은 살아남았습니다.</p>
            </div>
        </div>

        <!-- Math UI -->
        <div id="math-ui" class="hidden">
            <div class="math-card">
                <div id="math-problem">5 + 3 = ?</div>
                <div class="input-wrapper">
                    <input type="text" id="math-input" autocomplete="off" maxlength="3" placeholder="?">
                </div>
            </div>
        </div>

        <div id="three-container"></div>
    </div>

    <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
    <script src="game.js"></script>
</body>

</html>
