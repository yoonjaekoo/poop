<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>싸지른! - THE ULTIMATE SURVIVAL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- MathJax for LaTeX equations -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            options: {
                enableMenu: false
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>

<body>
    <div id="game-container">
        <!-- HUD -->
        <div id="hud">
            <div id="stage-display">STAGE 1 / 9</div>
        </div>
        <!-- Start Screen -->
        <div id="start-screen" class="overlay">
            <div class="glass-card">
                <h1 class="glitch" data-text="싸지른!">싸지른!</h1>
                <p class="subtitle">THE ULTIMATE SURVIVAL</p>
                <div class="start-btn-group">
                    <button class="btn btn-primary" id="start-btn">
                        <span>무대 시작</span>
                        <div class="btn-glow"></div>
                    </button>
                    <button class="btn btn-secondary" id="stage-select-btn">
                        <span>스테이지 선택</span>
                    </button>
                </div>
            </div>
            <div class="inspired-by">Inspired By 싸지른! - 마플 마인크래프트 채널</div>
        </div>

        <!-- Stage Select Overlay -->
        <div id="stage-select-screen" class="overlay hidden">
            <div class="glass-card">
                <h2 class="section-title">스테이지 선택</h2>
                <div id="stage-grid">
                    <button class="stage-btn" data-stage="1">1</button>
                    <button class="stage-btn" data-stage="2">2</button>
                    <button class="stage-btn" data-stage="3">3</button>
                    <button class="stage-btn" data-stage="4">4</button>
                    <button class="stage-btn" data-stage="5">5</button>
                    <button class="stage-btn" data-stage="6">6</button>
                    <button class="stage-btn" data-stage="7">7</button>
                    <button class="stage-btn" data-stage="8">8</button>
                    <button class="stage-btn" data-stage="9">9</button>
                </div>
                <button class="btn btn-text" id="back-to-menu">뒤로 가기</button>
            </div>
        </div>

        <!-- Game Over -->
        <div id="game-over" class="overlay hidden">
            <div class="glass-card">
                <div class="game-over-text">WASTED</div>
                <p class="stats">지려버렸습니다...</p>
                <button class="btn btn-secondary" id="restart-btn">다시 도전</button>
            </div>
        </div>

        <!-- Clear Screen -->
        <div id="clear-screen" class="overlay hidden">
            <div id="clear-text" class="hidden">
                <h1 class="clear-title">LEGENDARY</h1>
                <p>당신은 살아남았습니다.</p>
            </div>
        </div>

        <!-- Story Screen -->
        <div id="story-screen" class="overlay hidden">
            <div class="glass-card story-card">
                <div id="story-text-container">
                    <p id="story-line" class="story-text"></p>
                </div>
                <div class="story-btn-group">
                    <button class="btn btn-secondary" id="story-skip-btn">
                        <span>건너뛰기</span>
                    </button>
                    <button class="btn btn-primary" id="story-next-btn">
                        <span>다음</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Math UI -->
        <div id="math-ui" class="hidden">
            <div class="math-card">
                <div id="math-problem">\( 5x + 10 = 20, \quad x = ? \)</div>
                <div class="input-wrapper">
                    <input type="text" id="math-input" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="3" placeholder="?">
                </div>
            </div>
        </div>

        <!-- Mobile Controls -->
        <button id="mobile-control" class="hidden">
            <div id="control-label">JUMP</div>
        </button>

        <div id="three-container"></div>
    </div>

    <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
    <script src="game.js"></script>
</body>

</html>
