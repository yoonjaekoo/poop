<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>싸지른! - Sajireun!</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game-container">
        <!-- Start Screen -->
        <div id="start-screen" class="overlay">
            <h1>싸지른!</h1>
            <button class="btn" id="start-btn">무대</button>
        </div>

        <!-- Game Over -->
        <div id="game-over" class="overlay hidden">
            <div class="game-over-text">지렸다...</div>
            <button class="btn" id="restart-btn">다시 하기</button>
        </div>

        <!-- Clear Screen -->
        <div id="clear-screen" class="overlay hidden">
            <div id="clear-text" class="hidden">
                <h1 style="font-size: 4rem;">클리어!</h1>
            </div>
        </div>

        <!-- Math UI -->
        <div id="math-ui" class="hidden">
            <div id="math-problem">5 + 3 = ?</div>
            <input type="text" id="math-input" autocomplete="off" maxlength="3">
            <div id="timer-bar"></div>
        </div>

        <!-- Progress UI -->
        <div id="progress-container" class="hidden">
            <div id="progress-bar"></div>
        </div>

        <div id="three-container"></div>
    </div>

    <!-- Load Three.js from CDN -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.158.0/build/three.module.js"
        }
    }
    </script>
    <script type="module" src="game.js"></script>
</body>

</html>
